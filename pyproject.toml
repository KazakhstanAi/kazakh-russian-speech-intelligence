[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kazakh-russian-speech-intelligence"
version = "0.1.0"
description = "VAIS Voice: Kazakh-Russian voice AI evaluation, security and observability research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vais Research" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
audio = [
  "librosa>=0.11,<1",
  "soundfile>=0.13,<1",
]
ml = [
  "numpy>=2.0,<3",
  "torch>=2.6,<3",
  "transformers>=4.49,<5",
]

[project.urls]
Homepage = "https://vaislabs.com/projects/voice"
Repository = "https://github.com/KazakhstanAi/kazakh-russian-speech-intelligence"
Issues = "https://github.com/KazakhstanAi/kazakh-russian-speech-intelligence/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kazakh_russian_speech_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
